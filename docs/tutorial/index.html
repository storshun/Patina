<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patina in 5 Minutes</title>
<!-- (1.2.12) The guided tutorial, shipped with Patina: the welcome window and Help › Patina in 5 Minutes open it.
     The fonts are Patina's own: ../../fonts in the Windows folder and the source tree, ../../../patina/fonts in a
     Linux install (share/doc/patina/tutorial). -->
<style>
/* Layout: a fixed top bar (title, countdown, step-colored progress), the screenshot stage beside a side card,
   a fixed bottom bar (Back, Next, Play, key recap). One dark look on purpose: Patina's Vivid Dark theme. */
@font-face { font-family: "DejaVu Sans"; src: local("DejaVu Sans"), url("../../fonts/DejaVuSans.ttf") format("truetype"), url("../../../patina/fonts/DejaVuSans.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "DejaVu Sans"; src: local("DejaVu Sans Bold"), url("../../fonts/DejaVuSans-Bold.ttf") format("truetype"), url("../../../patina/fonts/DejaVuSans-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
@font-face { font-family: "DejaVu Sans Mono"; src: local("DejaVu Sans Mono"), url("../../fonts/DejaVuSansMono.ttf") format("truetype"), url("../../../patina/fonts/DejaVuSansMono.ttf") format("truetype"); font-display: swap; }
:root {
  color-scheme: dark;
  --menubar: #121A28; --window: #182030; --child: #151D2B; --popup: #161E2E; --border: #2A3550;
  --frame: #222C44; --frame-hover: #2C3854; --frame-active: #33405F; --button: #26314B; --button-hover: #2F3C5C;
  --text: #D3DAE3; --dim: #8B919D; --accent: #00A1C5; --accent-deep: #007C98; --accent-dim: #12384A;
  --accent-light: #5FD4EE; --on-accent: #FFFFFF; --warn: #E8A23A;
  --model: #5A8ED8; --uvs: #2CB2A6; --bake: #9A72DA; --paint: #E8852C; --export: #62B862;
  --radius: 5px;
  --ui: "DejaVu Sans", Verdana, "Bitstream Vera Sans", system-ui, sans-serif;
  --mono: "DejaVu Sans Mono", "Bitstream Vera Sans Mono", Menlo, Consolas, monospace;
  --step: var(--accent);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--window); color: var(--text); font: 14px/1.5 var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--menubar); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }
b { color: #fff; font-weight: 700; }
code, .k { font-family: var(--mono); }

/* ---------- top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--menubar); border-bottom: 1px solid var(--border);
  padding-block: 8px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; letter-spacing: .01em; text-wrap: balance; }
.brand .ver { color: var(--dim); font-size: 12px; }
.spacer { flex: 1; }
.clock { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 20px; padding: 2px 10px; border-radius: var(--radius);
  background: var(--frame); border: 1px solid var(--border); min-width: 84px; text-align: center; }
.clock.run { color: var(--accent-light); border-color: var(--accent-deep); }
.seg-btn { background: var(--button); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; font-size: 13px; }
.seg-btn:hover { background: var(--button-hover); }
.seg-btn[aria-pressed="true"] { background: var(--accent-deep); color: var(--on-accent); border-color: var(--accent-deep); }
.progress { display: flex; gap: 2px; margin-top: 8px; height: 22px; align-items: stretch; }
.progress button { border: 0; padding: 0; cursor: pointer; background: transparent; position: relative; min-width: 6px; }
.progress button i { position: absolute; left: 0; right: 0; bottom: 4px; height: 5px; border-radius: 2px; background: var(--c); opacity: .35; }
.progress button.done i { opacity: .75; }
.progress button.on i { opacity: 1; height: 8px; bottom: 3px; box-shadow: 0 0 0 1px var(--menubar), 0 0 0 2px var(--c); }
.progress button .fill { position: absolute; left: 0; bottom: 3px; height: 8px; border-radius: 2px; background: #fff; opacity: .55; width: 0; }

/* ---------- main */
main { padding-block: 16px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; max-width: 1880px; margin: 0 auto; align-items: start; }
@media (max-width: 1100px) { .lesson { grid-template-columns: minmax(0, 1fr) 340px; } }
@media (max-width: 860px) { .lesson { grid-template-columns: minmax(0, 1fr); } }

.stage-wrap { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 10; max-width: 100%; max-height: calc(100vh - 280px); min-height: 260px; background: #0d131e; border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; }
.shot { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform .45s ease; }
.shot img { display: block; max-width: none; user-select: none; -webkit-user-drag: none; }
.ring { position: absolute; border: 2px solid var(--accent-light); border-radius: 6px; box-shadow: 0 0 0 3px rgba(0,161,197,.28), 0 0 18px rgba(95,212,238,.35); pointer-events: none; }
.ring.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(0,161,197,.18), 0 0 26px rgba(95,212,238,.5); } }
.ring .tag { position: absolute; left: -2px; top: -24px; white-space: nowrap; font: 700 11px/1 var(--ui); background: var(--accent-deep); color: var(--on-accent);
  padding: 4px 6px; border-radius: 4px; }
.ring.below .tag { top: auto; bottom: -24px; }
.keys-on-shot { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 24px); pointer-events: none; }
.kchip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: var(--radius); background: rgba(18,26,40,.92);
  border: 1px solid var(--frame-active); box-shadow: 0 2px 0 #0a0f18; font: 700 14px/1 var(--mono); color: #fff; }
.kchip small { font: 400 12px/1 var(--ui); color: var(--dim); }
.caption { color: var(--dim); font-size: 12.5px; min-height: 1.5em; }
.views { display: flex; gap: 6px; flex-wrap: wrap; }
.views button { width: 92px; height: 56px; border-radius: 4px; border: 1px solid var(--border); background: var(--child) center/cover no-repeat; cursor: pointer; padding: 0; }
.views button[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

/* ---------- side card */
.card { background: var(--child); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.chip-step { align-self: flex-start; display: inline-flex; gap: 8px; align-items: center; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--step); border: 1px solid var(--step); border-radius: 999px; padding: 2px 10px 2px 4px; }
.chip-step .n { background: var(--step); color: #0d131e; border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; font-weight: 700; letter-spacing: 0; }
.card h2 { margin: 0; font-size: 20px; line-height: 1.25; text-wrap: balance; }
.budget { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.opt { color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 1px 6px; font-size: 11px; margin-left: 6px; }
ol.lines, ul.facts { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
ol.lines li::marker { color: var(--step); font-weight: 700; }
ul.facts { color: var(--dim); }
ul.facts b { color: var(--text); }
.result { border-left: 3px solid var(--step); padding: 4px 10px; color: var(--text); background: rgba(255,255,255,.02); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--dim); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--step); }
.tabpanel { display: grid; gap: 8px; }
.nopie { align-self: flex-start; font-size: 11px; color: var(--dim); background: var(--frame); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; }
.check { font-size: 11px; color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px; padding: 0 6px; }
.note { font-size: 12.5px; color: var(--dim); }
.note.bl { border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; }
.cmd { font-family: var(--mono); font-size: 12.5px; background: #0d131e; border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; overflow-x: auto; white-space: pre; }
.why, .watch { padding: 8px 10px; border-radius: 4px; font-size: 13.5px; }
.why { background: var(--popup); border: 1px solid var(--border); }
.why::before { content: "Why  "; font-weight: 700; color: var(--accent-light); }
.watch { background: rgba(232,162,58,.08); border: 1px solid rgba(232,162,58,.45); }
.watch::before { content: "Watch out  "; font-weight: 700; color: var(--warn); }
.favs { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px 10px; font-size: 12.5px; margin: 0; padding: 0; list-style: none; }
.favs li { background: var(--frame); border-radius: 4px; padding: 3px 8px; }
.favs li span { color: var(--dim); font-family: var(--mono); margin-right: 6px; }
.k { display: inline-block; padding: 0 5px; border: 1px solid var(--frame-active); border-bottom-width: 2px; border-radius: 4px; background: var(--frame); font-size: 12.5px; line-height: 1.5; color: #fff; white-space: nowrap; }

/* ---------- bottom bar */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--menubar); border-top: 1px solid var(--border);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bottom-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 1880px; margin: 0 auto; }
.btn { background: var(--button); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 14px; cursor: pointer; }
.btn:hover { background: var(--button-hover); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.next { background: var(--step); border-color: var(--step); color: #0d131e; font-weight: 700; }
.btn.next:hover { filter: brightness(1.08); }
.btn.play[aria-pressed="true"] { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--on-accent); }
.recap { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--dim); font-size: 12.5px; }
.recap .lbl { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.hint { color: var(--dim); font-size: 11.5px; }
@media (max-width: 860px) { .hint { display: none; } main { padding-bottom: 150px; } }

/* ---------- the end: recap and challenge */
.allkeys { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 12px; font-size: 12.5px; }
.allkeys div { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 3px; }
.allkeys span { color: var(--dim); }

/* ---------- overview artboard */
.overview { max-width: 1880px; margin: 0 auto; }
.overview h2 { font-size: 18px; margin: 0 0 4px; }
.overview p { margin: 0 0 14px; color: var(--dim); }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.mini { background: var(--child); border: 1px solid var(--border); border-top: 3px solid var(--c); border-radius: var(--radius); overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; }
.mini:hover { border-color: var(--c); }
.mini .th { aspect-ratio: 16/10; background: #0d131e center/cover no-repeat; }
.mini .meta { padding: 8px 10px; display: grid; gap: 4px; }
.mini .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--dim); }
.mini .row b { font-size: 13.5px; }
.mini .lines { font-size: 12px; color: var(--dim); margin: 0; padding-left: 16px; }
.mini .tagp { color: var(--c); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
@media (prefers-reduced-motion: reduce) { .shot { transition: none; } .ring.pulse { animation: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand"><h1>Patina in 5 Minutes</h1><span class="ver">Screens from Patina 1.2.11 · Guided layout · Vivid Dark</span></div>
    <div class="spacer"></div>
    <button class="seg-btn" id="ovBtn" aria-pressed="false" type="button">Overview</button>
    <div class="clock" id="clock" aria-label="Time left" role="timer">5:00</div>
  </div>
  <nav class="progress" id="progress" aria-label="Chapters"></nav>
</header>

<main>
  <section class="lesson" id="lesson" aria-live="polite">
    <div class="stage-wrap">
      <div class="stage" id="stage"><div class="shot" id="shot"><img id="img" alt=""></div><div class="keys-on-shot" id="keysOnShot"></div></div>
      <div class="caption" id="caption"></div>
      <div class="views" id="views" aria-label="Screenshots in this chapter"></div>
    </div>
    <aside class="card" id="card"></aside>
  </section>
  <section class="overview" id="overview" hidden>
    <h2>All chapters</h2>
    <p>One card for each chapter, for review. Click a card to open its chapter.</p>
    <div class="board" id="board"></div>
  </section>
</main>

<footer class="bottom">
  <div class="bottom-row">
    <button class="btn" id="back" type="button">Back</button>
    <button class="btn next" id="next" type="button">Next</button>
    <button class="btn play" id="play" type="button" aria-pressed="false">Play</button>
    <div class="recap" id="recap"></div>
    <span class="hint">→ or Space: next · ←: back</span>
  </div>
</footer>

<script>
(() => {
const C = { accent: "#00A1C5", model: "#5A8ED8", uvs: "#2CB2A6", bake: "#9A72DA", paint: "#E8852C", export: "#62B862" };
const STEP = { accent: "Start", model: "Model", uvs: "UVs", bake: "Bake", paint: "Paint", export: "Export" };
const SIZE = {"00_hero":[1500,940],"00_start":[1600,960],"01_add_to_quick_favorites":[270,229],"01_pie_q_tutorial_set":[533,274],"01_prefs_display":[524,866],"02_blender_menu":[349,150],"03_blender_link_panel":[399,360],"03_full_blender_link":[1600,960],"04_file_menu":[358,415],"04_model_step":[1600,960],"05_model_two_objects":[1600,960],"06_objects_list":[381,157],"06_paint_step_object":[1600,960],"07_pie_edit_island":[445,274],"07_pie_view_uvchecker":[458,274],"07_uv_checker_view":[582,805],"07_uv_menu":[281,395],"07_uvs_step":[1600,960],"08_ao_view":[1207,833],"08_bake_menu":[281,210],"08_bake_step_done":[1600,960],"08_pie_channels_ao":[467,274],"09_edit_new_layer_menu":[542,300],"09_paint_step_layers":[1600,960],"09_pie_q_addmenu":[533,274],"09_q_add_menu_open":[360,360],"10_brush_bar":[880,34],"10_brushes_shelf":[355,260],"11_material_editor":[444,764],"11_material_editor_bottom":[444,764],"11_material_rightclick":[271,199],"11_materials_shelf_user":[762,260],"12_builtin_applied":[1600,960],"12_grime_layer_list":[390,476],"12_grime_mask_settings":[390,476],"12_smart_masks_shelf":[762,260],"12_smart_shelf_builtin":[762,260],"13_folder_rightclick_menu":[284,477],"13_hat_folder_stack":[390,476],"13_save_dialog":[494,157],"13_smart_shelf_yours":[762,260],"13_used_on_crate":[1600,960],"14_export_step":[1600,960],"16_retopo_menu":[262,315]};
// the Quick Favorites pie (01_pie_q_tutorial_set): left, right, down, up, up-left, up-right, down-left, down-right
const QP = [[30,122,73,30],[327,122,176,30],[166,214,98,30],[176,30,78,30],[45,57,106,30],[276,57,127,30],[30,187,124,30],[277,187,117,30]];
const q = (slot, label) => ({ src: "01_pie_q_tutorial_set", rings: [[...QP[slot], label]], keys: [["Q", "hold"]], cap: "Hold Q over the 3D view. Move toward the item and release." });
const SAME = "The same command is in the pie. Use the pie from now on.";
const K = s => s.split(" ").map(x => `<span class="k">${x}</span>`).join(" ");

const CH = [
 { id: "ch-00-result", step: "accent", t: 10, title: "What you will make",

   views: [{ src: "00_hero", cap: "The finished scene, rendered in Patina with File › Render Image… (path traced)." }],

 { id: "ch-01-setup", step: "accent", t: 20, title: "Set up the window and your pie", defaultTab: "long",

     extra: `<ul class="favs"><li><span>1</span>Open</li><li><span>2</span>Add a model to the scene</li><li><span>3</span>Add menu</li><li><span>4</span>Object</li><li><span>5</span>Make island</li><li><span>6</span>Send to Blender</li><li><span>7</span>Export textures</li><li><span>8</span>Render image</li></ul>

             { src: "01_add_to_quick_favorites", rings: [[27,127,182,19,"Add to Quick Favorites"]], keys: [["RMB", "on a toolbar button"]], cap: "Right-click a toolbar button › Add to Quick Favorites." }] },

   fast: { lines: ["Hold Q › <b>Send to Blender</b>."], note: SAME, views: [q(5, "Send to Blender")] },

     extra: `<div class="note">For Claude Code, run this command:</div><div class="cmd">claude mcp add patina -- ~/.local/bin/patina --mcp</div>`,
     views: [{ src: "03_blender_link_panel", rings: [[7,311,134,22,"The same as patina --setup-claude"]], cap: "The terminal command does the same as this button." }] },
   why: "Claude can then use Patina's tools in your open window.",
   watch: "Keep a Patina window open. If no window is open, Claude starts a Patina without a window.",
   recap: [["patina --setup-claude", "Claude app"]] },

const MAIN = CH.filter(c => !c.optional);
const TOTAL = MAIN.reduce((a, c) => a + c.t, 0);   // 295 s
const startAt = i => CH.slice(0, i).filter(c => !c.optional).reduce((a, c) => a + c.t, 0);

// ---------- state
let cur = 0, tab = "long", view = 0, playing = false, tStart = 0, chElapsed = 0, raf = 0;
const $ = id => document.getElementById(id);
const stage = $("stage"), shot = $("shot"), img = $("img");

function viewsFor(c, t) {
  const v = [];
  if (c.views) v.push(...c.views);
  const side = c[t] || c.long || c.fast;
  if (side && side.views) v.push(...side.views);
  if (c.check) v.push(...c.check.views);
  return v;
}
function fmt(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function renderProgress() {
  const p = $("progress"); p.innerHTML = "";
  CH.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.style.flex = c.optional ? "0 0 26px" : String(c.t); b.style.setProperty("--c", C[c.step]);
    b.title = (c.optional ? "Optional: " : (i + ". ")) + c.title + (c.t ? " (" + c.t + " s)" : "");
    b.setAttribute("aria-label", b.title);
    b.innerHTML = '<i></i><span class="fill"></span>';
    if (c.optional) b.querySelector("i").style.background = "repeating-linear-gradient(90deg," + C.model + " 0 4px,transparent 4px 7px)";
    b.onclick = () => go(i);
    p.appendChild(b);
  });
}
function markProgress() {
  [...$("progress").children].forEach((b, i) => {
    b.classList.toggle("on", i === cur); b.classList.toggle("done", i < cur && !CH[i].optional);
    if (i === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    b.querySelector(".fill").style.width = i === cur && playing && CH[i].t ? Math.min(100, chElapsed / CH[i].t * 100) + "%" : "0";
  });
}

const KEYS = [["Ctrl+Shift+I"], ["Ctrl+right-drag"], ["Ctrl+B"], ["Ctrl+O"], ["Ctrl+E"], ["Ctrl+S"], ["Ctrl+L"], ["Shift+Z"], ["Shift+X"], ["Shift+A"], ["Shift+F"],
  ["F12"], ["F1"], ["Enter"], ["Esc"]];
const PHRASES = [[/Hold Q\b/g, "Hold " + K("Q")], [/hold Q\b/g, "hold " + K("Q")], [/Hold Z\b/g, "Hold " + K("Z")], [/Hold ` /g, "Hold " + K("`") + " "],
  [/tap Q\b/g, "tap " + K("Q")], [/press N\b/g, "press " + K("N")], [/\(W\)/g, "(" + K("W") + ")"], [/press G, R, or S/g, "press " + K("G") + ", " + K("R") + ", or " + K("S")],
  [/press X, Y, or Z/g, "press " + K("X") + ", " + K("Y") + ", or " + K("Z")], [/Press \[ and \]/g, "Press " + K("[") + " and " + K("]")], [/^<b>\/<\/b>/, K("/")]];
function keyify(t) {
  KEYS.forEach(([k]) => { t = t.split(k).join("\u0000" + k + "\u0001"); });
  t = t.replace(/\u0000([^\u0001]*)\u0001/g, (m, k) => k.includes("+") && !k.includes("right") ? k.split("+").map(x => K(x)).join("+") : K(k));
  PHRASES.forEach(([re, r]) => { t = t.replace(re, r); });
  return t;
}
function lineList(arr) { return arr && arr.length ? '<ol class="lines">' + arr.map(l => "<li>" + keyify(l) + "</li>").join("") + "</ol>" : ""; }
function renderCard() {
  const c = CH[cur], col = C[c.step];
  document.documentElement.style.setProperty("--step", col);
  const num = c.optional ? "+" : String(cur);
  let h = `<span class="chip-step"><span class="n">${num}</span>${STEP[c.step]}${c.optional ? "" : ""}</span>`;
  h += `<h2>${c.title}${c.optional ? '<span class="opt">Optional</span>' : ""}</h2>`;
  h += `<div class="budget">${c.optional ? "Not in the 5 minutes" : c.t + " s · starts at " + fmt(TOTAL + 5 - startAt(cur)) + " left"}</div>`;
  if (c.note0) h += `<div class="note">${c.note0}</div>`;
  if (c.facts) h += '<ul class="facts">' + c.facts.map(f => "<li>" + keyify(f) + "</li>").join("") + "</ul>";
  h += lineList(c.lines);
  if (c.long || c.fast) {
    h += `<div class="tabs" role="tablist">
      <button role="tab" type="button" id="tab-long" aria-selected="${tab === "long"}">Long way</button>
      <button role="tab" type="button" id="tab-fast" aria-selected="${tab === "fast"}">Fast way</button></div>`;
    const s = c[tab];
    h += '<div class="tabpanel" role="tabpanel">';
    if (s.nopie) h += '<span class="nopie">No pie yet</span>';
    h += lineList(s.lines);
    if (s.cmd) h += `<div class="cmd">${s.cmd}</div>`;
    if (s.extra) h += s.extra;
    if (s.note) h += `<div class="note">${s.note}</div>`;
    if (s.blender) h += `<div class="note bl">${keyify(s.blender)}</div>`;
    h += "</div>";
  }
  if (c.check) h += '<div class="note" style="color:var(--text)"><b>Check</b></div>' + lineList(c.check.lines);
  if (c.result) h += `<div class="result">${keyify(c.result)}</div>`;
  if (c.end) {
    const seen = new Map();
    MAIN.forEach(x => (x.recap || []).forEach(([k, d]) => { if (!seen.has(k + d)) seen.set(k + d, [k, d]); }));
    h += '<div class="allkeys">' + [...seen.values()].map(([k, d]) => `<div><span>${d}</span>${K(k)}</div>`).join("") + "</div>";
  }
  if (c.why) h += `<div class="why">${c.why}</div>`;
  if (c.watch) h += `<div class="watch">${c.watch}</div>`;
  $("card").innerHTML = h;
  const tl = $("tab-long"), tf = $("tab-fast");
  if (tl) { tl.onclick = () => setTab("long"); tf.onclick = () => setTab("fast"); }
  $("recap").innerHTML = '<span class="lbl">Keys</span>' + (c.recap || []).map(([k, d]) => `${K(k)} <span>${d}</span>`).join('<span aria-hidden="true">·</span>');
  $("back").disabled = cur === 0;
  $("next").textContent = cur === CH.length - 1 ? "Start again" : (CH[cur + 1].optional ? "Side quest" : "Next");
}

function renderViews() {
  const v = viewsFor(CH[cur], tab), box = $("views"); box.innerHTML = "";
  if (v.length < 2) return;
  v.forEach((x, i) => {
    const b = document.createElement("button"); b.type = "button";
    b.style.backgroundImage = `url(shots/${x.src}.webp)`;
    b.setAttribute("aria-label", "Screenshot " + (i + 1) + ": " + (x.cap || x.src));
    b.setAttribute("aria-current", String(i === view));
    b.onclick = () => { view = i; showView(); renderViewMarks(); };
    box.appendChild(b);
  });
}
function renderViewMarks() { [...$("views").children].forEach((b, i) => b.setAttribute("aria-current", String(i === view))); }

function showView() {
  const v = viewsFor(CH[cur], tab)[view] || viewsFor(CH[cur], tab)[0];
  if (!v) return;
  const [W, H] = SIZE[v.src];
  if (img.dataset.src !== v.src) { img.src = `shots/${v.src}.webp`; img.dataset.src = v.src; }
  img.width = W; img.height = H; img.alt = v.cap || "";
  shot.querySelectorAll(".ring").forEach(r => r.remove());
  (v.rings || []).forEach(([x, y, w, h, label, where]) => {
    const r = document.createElement("div"); r.className = "ring pulse";
    r.style.cssText = `left:${x - 3}px;top:${y - 3}px;width:${w + 6}px;height:${h + 6}px`;
    if (y < 30 || where === "below") r.classList.add("below");
    if (label) { const t = document.createElement("span"); t.className = "tag"; t.textContent = label; r.appendChild(t); }
    shot.appendChild(r);
  });
  $("keysOnShot").innerHTML = (v.keys || []).map(([k, d]) => `<span class="kchip">${k}${d ? `<small>${d}</small>` : ""}</span>`).join("");
  $("caption").textContent = v.cap || "";
  fit(v);
}
function fit(v) {
  v = v || viewsFor(CH[cur], tab)[view];
  if (!v) return;
  const [W, H] = SIZE[v.src];
  const f = v.focus || [0, 0, W, H];
  const sw = stage.clientWidth, sh = stage.clientHeight, pad = 24;
  const s = Math.min((sw - pad * 2) / f[2], (sh - pad * 2) / f[3], v.focus ? 3 : (W < 900 ? 1.6 : 2));
  let tx = sw / 2 - (f[0] + f[2] / 2) * s, ty = sh / 2 - (f[1] + f[3] / 2) * s;
  // keep the image's edges inside the stage when it is bigger than the stage
  if (W * s > sw) tx = Math.min(0, Math.max(sw - W * s, tx)); else tx = (sw - W * s) / 2;
  if (H * s > sh) ty = Math.min(0, Math.max(sh - H * s, ty)); else ty = (sh - H * s) / 2;
  shot.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  shot.querySelectorAll(".tag").forEach(t => t.style.transform = `scale(${1 / s})`, 0);
  shot.querySelectorAll(".tag").forEach(t => { t.style.transformOrigin = "0 100%"; });
  shot.querySelectorAll(".ring").forEach(r => { r.style.borderWidth = (2 / s) + "px"; r.style.borderRadius = (6 / s) + "px"; });
}

function setTab(t) { tab = t; view = 0; renderCard(); renderViews(); showView(); }
function go(i, keepPlay) {
  cur = (i + CH.length) % CH.length;
  const c = CH[cur];
  tab = c.long || c.fast ? (c.defaultTab || (cur === 1 ? "long" : "fast")) : "long";
  if (c.long && !c.fast) tab = "long";
  view = 0; chElapsed = 0; tStart = performance.now();
  renderCard(); renderViews(); showView(); markProgress(); clock();
  if (!keepPlay && playing && c.optional) setPlay(false);
  if (location.hash.slice(1) !== c.id) history.replaceState(null, "", "#" + c.id);
  showOverview(false);
}
function clock() {
  const c = CH[cur];
  const left = c.optional ? 0 : TOTAL + 5 - startAt(cur) - (playing ? chElapsed : 0);
  const el = $("clock"); el.textContent = c.optional ? "+" : fmt(left); el.classList.toggle("run", playing);
}
function tick(now) {
  if (!playing) return;
  const c = CH[cur];
  chElapsed = (now - tStart) / 1000;
  const v = viewsFor(c, tab);
  if (v.length > 1 && c.t) { const want = Math.min(v.length - 1, Math.floor(chElapsed / (c.t / v.length))); if (want !== view) { view = want; showView(); renderViewMarks(); } }
  if (c.t && chElapsed >= c.t) {
    if (cur + 1 < CH.length && !CH[cur + 1].optional) { go(cur + 1, true); }
    else { setPlay(false); }
  }
  markProgress(); clock();
  raf = requestAnimationFrame(tick);
}
function setPlay(on) {
  playing = on; const b = $("play"); b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "Pause" : "Play";
  if (on) { if (CH[cur].optional || cur === CH.length - 1) go(0, true); tStart = performance.now() - chElapsed * 1000; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
  else cancelAnimationFrame(raf);
  clock(); markProgress();
}

// ---------- overview artboard
function renderBoard() {
  const b = $("board");
  b.innerHTML = CH.map((c, i) => {
    const v = viewsFor(c, c.defaultTab || "fast")[0] || viewsFor(c, "long")[0];
    const lines = (c.lines || []).concat((c[c.defaultTab || "long"] || {}).lines || []).slice(0, 3);
    return `<button type="button" class="mini" style="--c:${C[c.step]}" data-i="${i}">
      <div class="th" style="background-image:url(shots/${v.src}.webp)"></div>
      <div class="meta"><span class="tagp">${c.optional ? "Optional" : STEP[c.step]}</span>
      <div class="row"><b>${c.optional ? "+" : i}. ${c.title}</b><span>${c.t ? c.t + " s" : ""}</span></div>
      ${lines.length ? '<ol class="lines">' + lines.map(l => "<li>" + l + "</li>").join("") + "</ol>" : ""}</div></button>`;
  }).join("");
  b.querySelectorAll(".mini").forEach(m => m.onclick = () => go(+m.dataset.i));
}
function showOverview(on) {
  $("overview").hidden = !on; $("lesson").hidden = on; $("ovBtn").setAttribute("aria-pressed", String(on));
  if (on) { setPlay(false); if (location.hash !== "#overview") history.replaceState(null, "", "#overview"); }
}

// ---------- wiring
$("back").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("play").onclick = () => setPlay(!playing);
$("ovBtn").onclick = () => showOverview($("overview").hidden);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
});
new ResizeObserver(() => fit()).observe(stage);
renderProgress(); renderBoard();
const h = location.hash.slice(1);
if (h === "overview") { go(0); showOverview(true); }
else { const i = CH.findIndex(c => c.id === h); go(i >= 0 ? i : 0); }
})();
</script>
</body>
</html>
